name: release

# Выпуск новой версии: поменять VERSION в src/speedtest.pyw и запушить в main.
# Если релиза vVERSION ещё нет — workflow соберёт Speedtest-Portable.exe и Speedtest-Setup.exe,
# подпишет latest.json, создаст тег и опубликует релиз. Все копии обновятся сами при следующем запуске.
# Правки без смены VERSION релиз не создают. Можно запустить и вручную (Actions → release → Run).
on:
  push:
    branches: [main]
    paths: ["src/**", "build/**", "tools/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Нужен ли релиз
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' src/speedtest.pyw)
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Релиз v$V уже есть — пропускаю (поменяйте VERSION для нового релиза)"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Инструменты
        if: steps.ver.outputs.skip != '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nsis unzip
          python3 -m pip install -q cryptography

      - name: Сборка и подпись
        if: steps.ver.outputs.skip != '1'
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          [ -n "$UPDATE_SIGNING_KEY" ] || { echo "нет секрета UPDATE_SIGNING_KEY"; exit 1; }
          ./build/build.sh
          python3 - <<'PY'
          import json, re
          pub = re.search(r'UPDATE_PUBKEY = "([0-9a-f]{64})"', open("src/speedtest.pyw", encoding="utf-8").read()).group(1)
          assert json.load(open("dist/latest.json"))["pub"] == pub, "ключ подписи не совпадает с UPDATE_PUBKEY в коде"
          PY

      - name: Публикация релиза
        if: steps.ver.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="${{ steps.ver.outputs.tag }}"
          gh release create "$T" dist/Speedtest-Portable.exe dist/Speedtest-Setup.exe dist/latest.json \
            --target "$GITHUB_SHA" --title "Speedtest $T" --notes "**Speedtest-Portable.exe** — без установки: скачал и запустил. **Speedtest-Setup.exe** — с ярлыками и записью в «Программах». Обе версии обновляются автоматически."
